name: CI/CD Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Nome do microserviço (catalogo, pagamento, pedido)'
        required: true
        type: string
      run_stress_spike_tests:
        description: 'Executar testes de stress e spike?'
        required: false
        type: boolean
        default: false
      run_chaos_tests:
        description: 'Executar testes de resiliência?'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

env:
  SERVICE_NAME: ${{ inputs.service_name }}
  IMAGE_NAME: ${{ vars.ACR_LOGIN_SERVER || 'acrctframework.azurecr.io' }}/${{ inputs.service_name }}

jobs:
  # =============================================
  # Stage 1: Build + Unit Tests + SAST
  # =============================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Build
        run: mvn clean compile -B -q

      - name: Unit Tests
        run: mvn test -B

      - name: Coverage Report
        run: mvn jacoco:report -B

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(awk -F'[<>]' '/<counter type="LINE"/{for(i=1;i<=NF;i++) if($i~/COVERED/) print $(i+1)}' target/site/jacoco/jacoco.xml | head -1)
          MISSED=$(awk -F'[<>]' '/<counter type="LINE"/{for(i=1;i<=NF;i++) if($i~/MISSED/) print $(i+1)}' target/site/jacoco/jacoco.xml | head -1)
          TOTAL=$((COVERED + MISSED))
          if [ "$TOTAL" -gt 0 ]; then
            RATIO=$(echo "scale=2; $COVERED / $TOTAL * 100" | bc)
            echo "Line coverage: ${RATIO}%"
          fi

      # - name: SAST — OWASP Dependency Check
      #   env:
      #     NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      #   run: |
      #     mvn org.owasp:dependency-check-maven:check -B || true

  # =============================================
  # Stage 2: Build Docker Image + Push ACR
  # =============================================
  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME || 'acrctframework' }}

      - name: Build and Push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t ${{ env.IMAGE_NAME }}:$SHORT_SHA \
                       -t ${{ env.IMAGE_NAME }}:latest \
                       --build-arg BUILDKIT_INLINE_CACHE=1 .
          docker push ${{ env.IMAGE_NAME }}:$SHORT_SHA
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Image Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'  # Não quebrar por enquanto

  # =============================================
  # Stage 3: Trigger ArgoCD Sync
  # =============================================
  deploy:
    name: Deploy to AKS via ArgoCD
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Wait for ArgoCD
        run: |
          echo "Waiting for ArgoCD server to be ready..."
          for i in $(seq 1 30); do
            if kubectl get deployment argocd-server -n argocd &>/dev/null && \
               kubectl rollout status deployment/argocd-server -n argocd --timeout=10s &>/dev/null; then
              echo "ArgoCD server is ready"
              exit 0
            fi
            echo "Attempt $i/30: ArgoCD not ready yet..."
            sleep 10
          done
          echo "ERROR: ArgoCD server did not become ready after 5 minutes" >&2
          exit 1

      - name: Ensure Application exists
        run: |
          if kubectl get application ${{ env.SERVICE_NAME }} -n argocd &>/dev/null; then
            echo "Application '${{ env.SERVICE_NAME }}' already exists"
          else
            echo "Creating ArgoCD Application for ${{ env.SERVICE_NAME }}..."
            cat <<APPEOF | kubectl apply -f -
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: ${{ env.SERVICE_NAME }}
              namespace: argocd
              finalizers:
                - resources-finalizer.argocd.argoproj.io
            spec:
              project: default
              source:
                repoURL: https://github.com/Dorigao-LTDA/central-gitops.git
                targetRevision: main
                path: deploy/helm/service-chart
                helm:
                  valueFiles:
                    - ../../values/${{ env.SERVICE_NAME }}.yaml
              destination:
                server: https://kubernetes.default.svc
                namespace: app
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
                syncOptions:
                  - CreateNamespace=true
            APPEOF
            echo "Application created"
          fi

      - name: Wait for Application
        run: |
          echo "Waiting for ArgoCD Application '${{ env.SERVICE_NAME }}' to exist..."
          for i in $(seq 1 30); do
            if kubectl get application ${{ env.SERVICE_NAME }} -n argocd &>/dev/null; then
              echo "Application '${{ env.SERVICE_NAME }}' exists"
              exit 0
            fi
            echo "Attempt $i/30: Application not found yet..."
            sleep 10
          done
          echo "ERROR: Application '${{ env.SERVICE_NAME }}' not found after 5 minutes" >&2
          echo "Ensure the root-app has synced and created the Application resource" >&2
          exit 1

      - name: Trigger ArgoCD Sync
        run: |
          kubectl patch application ${{ env.SERVICE_NAME }} -n argocd \
            -p '{"operation":{"sync":{"revision":"${{ github.sha }}"}}}' \
            --type=merge

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n app --timeout=300s

  # =============================================
  # Stage 4: Smoke Test
  # =============================================
  smoke-test:
    name: Smoke Test (k6)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Generate k6 env from NFR
        run: |
          python3 /tmp/ct-common/scripts/nfr-to-env.py --nfr nfr.yaml --output nfr-env.sh --service ${{ env.SERVICE_NAME }}
          sed 's/^export //' nfr-env.sh > /tmp/k6-env.txt

      - name: Run k6 Smoke
        run: |
          bash /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/smoke.js \
            ${{ env.SERVICE_NAME }} \
            smoke-results.json \
            /tmp/k6-env.txt \
            300 smoke

      - name: Upload Smoke Results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-results.json

  # =============================================
  # Stage 5: Performance Test (Baseline)
  # =============================================
  performance-test:
    name: Performance Test (k6)
    needs: [deploy, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Generate k6 env from NFR
        run: |
          python3 /tmp/ct-common/scripts/nfr-to-env.py --nfr nfr.yaml --output nfr-env.sh --service ${{ env.SERVICE_NAME }}
          sed 's/^export //' nfr-env.sh > /tmp/k6-env.txt

      - name: Run k6 Baseline
        run: |
          bash /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/baseline.js \
            ${{ env.SERVICE_NAME }} \
            baseline-results.json \
            /tmp/k6-env.txt \
            600 baseline

      - name: Run k6 Stress
        if: ${{ inputs.run_stress_spike_tests == true }}
        continue-on-error: true
        run: |
          bash /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/stress.js \
            ${{ env.SERVICE_NAME }} \
            stress-results.json \
            /tmp/k6-env.txt \
            900 stress

      - name: Run k6 Spike
        if: ${{ inputs.run_stress_spike_tests == true }}
        continue-on-error: true
        run: |
          bash /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/spike.js \
            ${{ env.SERVICE_NAME }} \
            spike-results.json \
            /tmp/k6-env.txt \
            600 spike

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            baseline-results.json
            stress-results.json
            spike-results.json

  # =============================================
  # Stage 6: Resilience Test
  # =============================================
  resilience-test:
    name: Resilience Test (Chaos)
    needs: [deploy, smoke-test, performance-test]
    runs-on: ubuntu-latest
    if: ${{ inputs.run_chaos_tests == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Generate k6 env from NFR
        run: |
          python3 /tmp/ct-common/scripts/nfr-to-env.py --nfr nfr.yaml --output nfr-env.sh --service ${{ env.SERVICE_NAME }}
          sed 's/^export //' nfr-env.sh > /tmp/k6-env.txt

      - name: Ensure Chaos Mesh is installed
        run: |
          if kubectl get crd podchaos.chaos-mesh.org &>/dev/null; then
            echo "Chaos Mesh CRDs found"
          else
            echo "Chaos Mesh not installed. Installing via Helm..."
            helm repo add chaos-mesh https://charts.chaos-mesh.org
            helm repo update
            helm upgrade --install chaos-mesh chaos-mesh/chaos-mesh \
              --namespace chaos-mesh --create-namespace \
              --set createCustomResource=true \
              --version ${{ vars.CHAOS_MESH_CHART_VERSION || '2.6.3' }} \
              --wait --timeout 5m
          fi
          kubectl get pods -n chaos-mesh --no-headers 2>/dev/null | head -5 || \
            echo "No Chaos Mesh pods found - experiments may fail"

      - name: Generate Chaos manifests from NFR
        run: |
          python3 /tmp/ct-common/scripts/nfr-to-chaos.py \
            --nfr nfr.yaml \
            --service ${{ env.SERVICE_NAME }} \
            --output-dir chaos-generated
          echo "Generated manifests:"
          ls -la chaos-generated/

      # ---------------------------------------------------------------
      # Helper: run one chaos experiment with in-cluster k6 + canary recovery
      # ---------------------------------------------------------------
      - name: Write chaos runner script
        shell: bash
        run: |
          cat > /tmp/run-chaos-experiment.sh << 'RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail
          #
          # run-chaos-experiment <manifest> <experiment_name> <duration_seconds> <service>
          #
          # 1. Starts k6 Job in-cluster (chaos-traffic.js, GET only)
          # 2. Applies chaos manifest
          # 3. Runs health canary to measure real outage
          # 4. Waits for chaos duration
          # 5. Waits for k6 Job to complete, extracts summary
          # 6. Cleans up (--wait=false, no hang on stresschaos finalizers)
          # Writes: /tmp/chaos-results/<exp_name>.json, /tmp/chaos-recovery-times.txt
          #
          MANIFEST="$1"
          EXP_NAME="$2"
          DURATION="$3"
          SERVICE="$4"
          NAMESPACE="app"

          mkdir -p /tmp/chaos-results

          # --- 1. Create k6 Job for chaos-traffic.js ---
          K6_JOB="k6-chaos-${EXP_NAME}-$(date +%s)"
          echo "=== Creating k6 Job ${K6_JOB} for chaos-traffic.js ==="
          kubectl create configmap "${K6_JOB}-scripts" \
            --from-file="perf/" -n "$NAMESPACE" 2>&1
          kubectl create configmap "${K6_JOB}-env" \
            --from-env-file="/tmp/k6-env.txt" -n "$NAMESPACE" 2>&1

          cat <<JOBEOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "${K6_JOB}"
            namespace: "${NAMESPACE}"
            labels:
              app: k6-test
              chaos-experiment: "${EXP_NAME}"
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                - name: k6
                  image: grafana/k6:latest
                  command: ["k6", "run", "/scripts/chaos-traffic.js",
                    "--summary-export=/output/${EXP_NAME}.json",
                    "--tag", "test_type=chaos",
                    "--tag", "chaos_experiment=${EXP_NAME}"]
                  envFrom:
                  - configMapRef:
                      name: "${K6_JOB}-env"
                  volumeMounts:
                  - name: scripts
                    mountPath: /scripts
                  - name: output
                    mountPath: /output
                volumes:
                - name: scripts
                  configMap:
                    name: "${K6_JOB}-scripts"
                - name: output
                  emptyDir: {}
          JOBEOF

          kubectl wait --for=condition=ready pod \
            -l "job-name=${K6_JOB}" -n "$NAMESPACE" --timeout=60s 2>&1 || true
          K6_POD="$(kubectl get pods -l "job-name=${K6_JOB}" -n "$NAMESPACE" -o jsonpath='{.items[0].metadata.name}')"
          echo "=== k6 Job pod: ${K6_POD} ==="

          sleep 3

          # --- 2. Apply chaos ---
          echo "=== Applying ${EXP_NAME} ==="
          kubectl apply -f "${MANIFEST}"

          # --- 3. Start health canary ---
          echo "=== Monitoring recovery for ${EXP_NAME} ==="
          (
            OUTAGE_START=0; OUTAGE_END=0
            CANARY_MAX=$(( DURATION + 300 ))
            for i in $(seq 1 ${CANARY_MAX}); do
              if curl -sf --max-time 5 http://localhost:8080/health >/dev/null 2>&1; then
                if [ "$OUTAGE_START" -ne 0 ] && [ "$OUTAGE_END" -eq 0 ]; then
                  OUTAGE_END=$(date +%s)
                  echo "=== Canary: recovered at t=$((i-1))s ==="
                fi
              else
                if [ "$OUTAGE_START" -eq 0 ]; then
                  OUTAGE_START=$(date +%s)
                  echo "=== Canary: outage detected at t=$((i-1))s ==="
                fi
              fi
              if [ "$i" -gt "$DURATION" ]; then
                if [ "$OUTAGE_START" -eq 0 ]; then break; fi
                if [ "$OUTAGE_END" -ne 0 ]; then break; fi
              fi
              sleep 1
            done
            echo "$OUTAGE_START $OUTAGE_END" > /tmp/canary-outage-${EXP_NAME}.txt
          ) &
          CANARY_PID=$!

          # --- 4. Wait for chaos duration ---
          echo "=== Waiting ${DURATION}s for chaos ${EXP_NAME} ==="

          # Background: poll for k6 summary before container exits
          (
            for i in $(seq 1 $(( DURATION + 120 ))); do
              if kubectl exec "$K6_POD" -n "$NAMESPACE" -- test -f "/output/${EXP_NAME}.json" 2>/dev/null; then
                kubectl exec "$K6_POD" -n "$NAMESPACE" -- cat "/output/${EXP_NAME}.json" > "/tmp/chaos-results/${EXP_NAME}.json" 2>/dev/null
                echo "=== Extracted k6 summary for ${EXP_NAME} at t+${i}s ==="
                break
              fi
              sleep 1
            done
          ) &
          EXTRACT_PID=$!

          sleep "${DURATION}"

          # --- 5. Wait for k6 Job to complete ---
          echo "=== Waiting for k6 Job ${K6_JOB} to complete ==="
          kubectl wait --for=condition=complete job/"${K6_JOB}" -n "$NAMESPACE" --timeout=120s 2>&1 || {
            echo "=== WARNING: k6 Job did not complete in time ==="
          }
          kubectl logs "$K6_POD" -n "$NAMESPACE" 2>&1 || true

          wait "${EXTRACT_PID}" 2>/dev/null || true

          if [ ! -s "/tmp/chaos-results/${EXP_NAME}.json" ]; then
            echo "=== WARNING: k6 summary still empty ==="
            echo "{}" > "/tmp/chaos-results/${EXP_NAME}.json"
          fi

          kubectl delete job "${K6_JOB}" -n "$NAMESPACE" --ignore-not-found 2>/dev/null || true
          kubectl delete configmap "${K6_JOB}-scripts" "${K6_JOB}-env" \
            -n "$NAMESPACE" --ignore-not-found 2>/dev/null || true

          # --- 6. Wait for canary and compute recovery ---
          wait "${CANARY_PID}" 2>/dev/null || true
          read -r OUTAGE_START OUTAGE_END < /tmp/canary-outage-${EXP_NAME}.txt 2>/dev/null || true
          OUTAGE_START=${OUTAGE_START:-0}; OUTAGE_END=${OUTAGE_END:-0}
          if [ "$OUTAGE_START" = "0" ]; then RECOVERY_SEC=0; else
            if [ "$OUTAGE_END" = "0" ]; then RECOVERY_SEC=-1; else
              RECOVERY_SEC=$(( OUTAGE_END - OUTAGE_START ))
            fi
          fi
          echo "Recovery time: ${RECOVERY_SEC}s"

          # Cleanup chaos
          echo "=== Cleaning up ${EXP_NAME} ==="
          kubectl delete -f "${MANIFEST}" --ignore-not-found --wait=false 2>/dev/null || true

          RECOVERY_SEC=${RECOVERY_SEC:--1}
          echo "${EXP_NAME}: ${RECOVERY_SEC}s" >> /tmp/chaos-recovery-times.txt
          RUNNER

          chmod +x /tmp/run-chaos-experiment.sh

      - name: Port-forward to AKS (persistent)
        run: |
          (
            while true; do
              kubectl port-forward -n app svc/${{ env.SERVICE_NAME }} 8080:8080 || true
              sleep 1
            done
          ) &
          PF_PID=$!
          echo "$PF_PID" > /tmp/pf-pid.txt
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then
              echo "Tunnel ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Tunnel failed after 30s" >&2
          exit 1

      # =============================================================
      # Dynamic chaos experiments — iterate over generated manifests
      # =============================================================
      - name: Run all chaos experiments
        run: |
          jq -c '.experiments[]' chaos-generated/manifest-list.json | while read exp; do
            NAME=$(echo "$exp" | jq -r '.name')
            FILE=$(echo "$exp" | jq -r '.file')
            TYPE=$(echo "$exp" | jq -r '.type')
            echo "=== Running chaos experiment: $NAME (type=$TYPE) ==="
            if timeout $(( 60 + 420 )) /tmp/run-chaos-experiment.sh \
              "$FILE" \
              "$NAME" \
              "60" \
              "${{ env.SERVICE_NAME }}"; then
              :
            else
              RC=$?
              if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then
                echo "=== TIMEOUT: experiment $NAME hung — recording failure ==="
                echo "${NAME}: -1s" >> /tmp/chaos-recovery-times.txt
              else
                echo "=== WARNING: experiment $NAME exited with code $RC ==="
              fi
            fi
          done

      # =============================================================
      # Consolidate results
      # =============================================================
      - name: Consolidate chaos results
        run: |
          # Build recovery JSON from collected times
          RECOVERY_JSON="{"
          FIRST=true
          if [ -f /tmp/chaos-recovery-times.txt ]; then
            while IFS=':' read -r exp_name recovery_sec; do
              exp_name=$(echo "$exp_name" | xargs)
              recovery_sec=$(echo "$recovery_sec" | xargs | sed 's/s//')
              if [ "$FIRST" = true ]; then FIRST=false; else RECOVERY_JSON+=","; fi
              RECOVERY_JSON+="\"${exp_name}\": {\"recovery_time_seconds\": ${recovery_sec}}"
            done < /tmp/chaos-recovery-times.txt
          fi
          RECOVERY_JSON+="}"
          echo "$RECOVERY_JSON" > chaos-recovery.json
          echo "=== Recovery times ==="
          cat chaos-recovery.json

          # Merge per-experiment k6 summary exports into one NDJSON file
          if ls /tmp/chaos-results/*.json 2>/dev/null; then
            for f in /tmp/chaos-results/*.json; do
              [ -s "$f" ] && jq -c '.metrics | to_entries[] | {type: "Metric", metric: .key, data: {values: .value.values}}' "$f"
            done > chaos-results.json 2>/dev/null || true
          fi

      - name: Cleanup Chaos
        run: |
          # Kill any leftover k6 Jobs and ConfigMaps
          kubectl delete job -l app=k6-test -n app --ignore-not-found 2>/dev/null || true
          kubectl delete configmap -l app=k6-test -n app --ignore-not-found 2>/dev/null || true
          # Kill port-forward
          if [ -f /tmp/pf-pid.txt ]; then
            kill $(cat /tmp/pf-pid.txt) 2>/dev/null || true
          fi
          pkill -f "port-forward.*svc/${{ env.SERVICE_NAME }}" 2>/dev/null || true
          # Remove any leftover chaos resources
          timeout 30s kubectl delete podchaos --all -n app --ignore-not-found 2>/dev/null || true
          timeout 30s kubectl delete networkchaos --all -n app --ignore-not-found 2>/dev/null || true
          timeout 30s kubectl delete stresschaos --all -n app --ignore-not-found 2>/dev/null || true

      - name: Upload Chaos Results
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: |
            chaos-results.json
            chaos-recovery.json

  # =============================================
  # Stage 7: Gate Evaluation
  # =============================================
  gate-evaluation:
    name: Gate Evaluation
    needs: [smoke-test, performance-test, resilience-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Download all results
        uses: actions/download-artifact@v4

      - name: Validate against NFR
        run: |
          python3 /tmp/ct-common/scripts/evaluate-gates.py \
            --artifacts . \
            --nfr nfr.yaml \
            --service ${{ env.SERVICE_NAME }}

      - name: Upload Gate Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-summary
          path: gate-summary.json

  # =============================================
  # Stage 8: LLM Insights & Developer Report
  # =============================================
  insights-report:
    name: Insights & Developer Report
    needs: [smoke-test, performance-test, resilience-test, gate-evaluation]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Download all test artifacts
        uses: actions/download-artifact@v4

      - name: Analyze code changes
        run: |
          BASE=$(git merge-base HEAD~1 HEAD 2>/dev/null || echo "HEAD~1")
          python3 /tmp/ct-common/scripts/insights/code-analyze.py \
            --repo-path . \
            --base-ref "$BASE" \
            --service ${{ env.SERVICE_NAME }} \
            --output insights-input-code.json

      - name: Azure Login + Set AKS Context
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Collect observability data
        id: o11y
        continue-on-error: true
        run: |
          kubectl port-forward -n observability svc/mimir-gateway 9090:8080 &
          kubectl port-forward -n observability svc/loki 3100:3100 &
          kubectl port-forward -n observability svc/tempo 3200:3100 &
          sleep 5
          python3 /tmp/ct-common/scripts/insights/o11y-collect.py \
            --mimir-url http://localhost:9090/prometheus \
            --loki-url http://localhost:3100 \
            --tempo-url http://localhost:3200 \
            --service ${{ env.SERVICE_NAME }} \
            --test-window "$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)/$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output insights-input-o11y.json
          kill %1 %2 %3 2>/dev/null || true

      - name: Collect test data
        run: |
          python3 /tmp/ct-common/scripts/insights/collect.py \
            --artifacts-dir . \
            --nfr nfr.yaml \
            --service ${{ env.SERVICE_NAME }} \
            --commit ${{ github.sha }} \
            --o11y-input insights-input-o11y.json \
            --code-input insights-input-code.json \
            --output insights-input.json

      - name: Analyze with LLM
        env:
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_DEPLOYMENT: ${{ vars.LLM_DEPLOYMENT || 'DeepSeek-V4-Flash' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
        run: |
          pip install -q openai 2>/dev/null || pip install openai
          # Prefer configured API key; fall back to OIDC token for Azure OpenAI RBAC
          if [ -n "$LLM_API_KEY" ]; then
            echo "Using configured LLM_API_KEY for LLM auth"
          else
            OIDC_TOKEN=$(az account get-access-token \
              --resource https://cognitiveservices.azure.com \
              --query accessToken -o tsv 2>/dev/null || echo "")
            if [ -n "$OIDC_TOKEN" ]; then
              export LLM_API_KEY="$OIDC_TOKEN"
              echo "Using OIDC token for LLM auth"
            else
              echo "WARNING: No LLM auth available. Report will be partial."
            fi
          fi
          python3 /tmp/ct-common/scripts/insights/analyze.py \
            --input insights-input.json \
            --output insights-llm-response.json

      - name: Generate report
        if: always()
        run: |
          python3 /tmp/ct-common/scripts/insights/report.py \
            --test-data insights-input.json \
            --llm-response insights-llm-response.json \
            --output insights-report.md

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insights-report-${{ env.SERVICE_NAME }}
          path: |
            insights-report.md
            insights-report.json
            insights-input.json

      - name: Post report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('insights-report.md', 'utf8');
            const truncated = report.length > 60000
              ? report.substring(0, 60000) + '\n\n> ... (truncated — full report in artifacts)'
              : report;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: truncated
            });
