name: Performance Test Only (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Nome do microserviço (catalogo, pagamento, pedido)'
        required: true
        type: string
      run_stress_spike_tests:
        description: 'Executar testes de stress e spike?'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

env:
  SERVICE_NAME: ${{ inputs.service_name }}

jobs:
  performance-test:
    name: Performance Test (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Generate k6 env from NFR
        run: |
          python3 /tmp/ct-common/scripts/nfr-to-env.py --nfr nfr.yaml --output nfr-env.sh --service ${{ env.SERVICE_NAME }}
          sed 's/^export //' nfr-env.sh > /tmp/k6-env.txt

      - name: Run k6 Smoke
        run: |
          bash /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/smoke.js \
            ${{ env.SERVICE_NAME }} \
            smoke-results.json \
            /tmp/k6-env.txt \
            300 smoke

      - name: Run k6 Baseline
        run: |
          bash /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/baseline.js \
            ${{ env.SERVICE_NAME }} \
            baseline-results.json \
            /tmp/k6-env.txt \
            600 baseline

      - name: Run k6 Stress
        if: ${{ inputs.run_stress_spike_tests == true }}
        continue-on-error: true
        run: |
          bash /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/stress.js \
            ${{ env.SERVICE_NAME }} \
            stress-results.json \
            /tmp/k6-env.txt \
            900 stress

      - name: Run k6 Spike
        if: ${{ inputs.run_stress_spike_tests == true }}
        continue-on-error: true
        run: |
          bash /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/spike.js \
            ${{ env.SERVICE_NAME }} \
            spike-results.json \
            /tmp/k6-env.txt \
            600 spike

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            smoke-results.json
            baseline-results.json
            stress-results.json
            spike-results.json

      - name: Debug summary content
        run: |
          for f in smoke-results.json baseline-results.json stress-results.json spike-results.json; do
            echo "=== $f ==="
            if [ -f "$f" ]; then
              wc -c < "$f"
              head -c 2000 "$f"
            else
              echo "FILE NOT FOUND: $f"
            fi
            echo ""
          done

      - name: Evaluate gates
        run: |
          python3 /tmp/ct-common/scripts/evaluate-gates.py \
            --artifacts . \
            --nfr nfr.yaml \
            --service ${{ env.SERVICE_NAME }}

      - name: Upload Gate Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-summary
          path: gate-summary.json

      - name: Cleanup orphaned k6 jobs
        if: always()
        run: |
          kubectl delete job -l app=k6-test -n app --ignore-not-found 2>/dev/null || true
          kubectl delete configmap -l app=k6-test -n app --ignore-not-found 2>/dev/null || true

  insights-report:
    name: Insights and Developer Report
    needs: [performance-test]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Download all test artifacts
        uses: actions/download-artifact@v4

      - name: Analyze code changes
        continue-on-error: true
        run: |
          BASE=$(git merge-base HEAD~1 HEAD 2>/dev/null || echo "HEAD~1")
          python3 /tmp/ct-common/scripts/insights/code-analyze.py \
            --repo-path . \
            --base-ref "$BASE" \
            --service ${{ inputs.service_name }} \
            --output insights-input-code.json

      - name: Azure Login (for LLM OIDC token)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Collect observability data
        id: o11y
        continue-on-error: true
        run: |
          kubectl port-forward -n observability svc/mimir-gateway 9090:8080 &
          kubectl port-forward -n observability svc/loki 3100:3100 &
          kubectl port-forward -n observability svc/tempo 3200:3100 &
          sleep 5
          python3 /tmp/ct-common/scripts/insights/o11y-collect.py \
            --mimir-url http://localhost:9090/prometheus \
            --loki-url http://localhost:3100 \
            --tempo-url http://localhost:3200 \
            --service ${{ inputs.service_name }} \
            --test-window "$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)/$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output insights-input-o11y.json
          kill %1 %2 %3 2>/dev/null || true

      - name: Collect test data
        run: |
          python3 /tmp/ct-common/scripts/insights/collect.py \
            --artifacts-dir . \
            --nfr nfr.yaml \
            --service ${{ inputs.service_name }} \
            --commit ${{ github.sha }} \
            --o11y-input insights-input-o11y.json \
            --code-input insights-input-code.json \
            --output insights-input.json

      - name: Analyze with LLM
        env:
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_DEPLOYMENT: ${{ vars.LLM_DEPLOYMENT || 'DeepSeek-V4-Flash' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
        run: |
          pip install -q openai 2>/dev/null || pip install openai
          if [ -n "$LLM_API_KEY" ]; then
            echo "Using configured LLM_API_KEY for auth"
          else
            TOKEN=$(az account get-access-token --resource https://cognitiveservices.azure.com --query accessToken -o tsv 2>/dev/null || echo "")
            if [ -n "$TOKEN" ]; then
              export LLM_API_KEY="$TOKEN"
              echo "Using OIDC token for auth"
            else
              echo "WARNING: No LLM auth available"
            fi
          fi
          python3 /tmp/ct-common/scripts/insights/analyze.py \
            --input insights-input.json \
            --output insights-llm-response.json

      - name: Generate report
        if: always()
        run: |
          python3 /tmp/ct-common/scripts/insights/report.py \
            --test-data insights-input.json \
            --llm-response insights-llm-response.json \
            --output insights-report.md

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insights-report
          path: |
            insights-report.md
            insights-report.json
            insights-input.json
