name: Performance Test Only (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Nome do microserviço (catalogo, pagamento, pedido)'
        required: true
        type: string
      run_stress_spike_tests:
        description: 'Executar testes de stress e spike?'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

env:
  SERVICE_NAME: ${{ inputs.service_name }}

jobs:
  performance-test:
    name: Performance Test (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Generate k6 env from NFR
        run: |
          python3 /tmp/ct-common/scripts/nfr-to-env.py --nfr nfr.yaml --output nfr-env.sh --service ${{ env.SERVICE_NAME }}
          sed 's/^export //' nfr-env.sh > /tmp/k6-env.txt

      - name: Run k6 Smoke
        run: |
          /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/smoke.js \
            ${{ env.SERVICE_NAME }} \
            smoke-results.json \
            /tmp/k6-env.txt \
            300 smoke

      - name: Run k6 Baseline
        run: |
          /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/baseline.js \
            ${{ env.SERVICE_NAME }} \
            baseline-results.json \
            /tmp/k6-env.txt \
            600 baseline

      - name: Run k6 Stress
        if: ${{ inputs.run_stress_spike_tests == true }}
        continue-on-error: true
        run: |
          /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/stress.js \
            ${{ env.SERVICE_NAME }} \
            stress-results.json \
            /tmp/k6-env.txt \
            900 stress

      - name: Run k6 Spike
        if: ${{ inputs.run_stress_spike_tests == true }}
        continue-on-error: true
        run: |
          /tmp/ct-common/scripts/k6-job-runner.sh \
            perf/spike.js \
            ${{ env.SERVICE_NAME }} \
            spike-results.json \
            /tmp/k6-env.txt \
            600 spike

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            smoke-results.json
            baseline-results.json
            stress-results.json
            spike-results.json

      - name: Debug summary content
        run: |
          for f in smoke-results.json baseline-results.json stress-results.json spike-results.json; do
            echo "=== $f ==="
            if [ -f "$f" ]; then
              wc -c < "$f"
              head -c 2000 "$f"
            else
              echo "FILE NOT FOUND: $f"
            fi
            echo ""
          done

      - name: Evaluate gates
        run: |
          python3 /tmp/ct-common/scripts/evaluate-gates.py \
            --artifacts . \
            --nfr nfr.yaml \
            --service ${{ env.SERVICE_NAME }}

      - name: Upload Gate Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-summary
          path: gate-summary.json

      - name: Cleanup orphaned k6 jobs
        if: always()
        run: |
          kubectl delete job -l app=k6-test -n app --ignore-not-found 2>/dev/null || true
          kubectl delete configmap -l app=k6-test -n app --ignore-not-found 2>/dev/null || true
