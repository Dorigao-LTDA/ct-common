name: Resilience Test Only (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Nome do microserviço (catalogo, pagamento, pedido)'
        required: true
        type: string
      chaos_experiments_filter:
        description: 'Filtrar experimentos por nome (vírgula separado; vazio = todos do nfr.yaml)'
        required: false
        type: string
        default: ''
      chaos_duration_seconds:
        description: 'Duração em segundos para cada experimento'
        required: false
        type: number
        default: 120
      run_pod_kill:
        description: 'DEPRECATED: use chaos_experiments_filter instead'
        required: false
        type: boolean
        default: true
      run_network_delay:
        description: 'DEPRECATED: use chaos_experiments_filter instead'
        required: false
        type: boolean
        default: true
      run_cpu_stress:
        description: 'DEPRECATED: use chaos_experiments_filter instead'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  SERVICE_NAME: ${{ inputs.service_name }}
  CHAOS_NAMESPACE: app
  CHAOS_DURATION: ${{ inputs.chaos_duration_seconds }}

jobs:
  resilience-test:
    name: Resilience Test (Chaos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone shared toolkit
        run: git clone --depth 1 https://github.com/Dorigao-LTDA/ct-common.git /tmp/ct-common

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Generate k6 env from NFR
        run: |
          python3 /tmp/ct-common/scripts/nfr-to-env.py --nfr nfr.yaml \
            --output nfr-env.sh --service ${{ env.SERVICE_NAME }}
          sed 's/^export //' nfr-env.sh > /tmp/k6-env.txt

      - name: Ensure Chaos Mesh is installed
        run: |
          if kubectl get crd podchaos.chaos-mesh.org &>/dev/null; then
            echo "Chaos Mesh CRDs found"
          else
            echo "Chaos Mesh not installed. Installing via Helm..."
            helm repo add chaos-mesh https://charts.chaos-mesh.org
            helm repo update
            helm upgrade --install chaos-mesh chaos-mesh/chaos-mesh \
              --namespace chaos-mesh --create-namespace \
              --set createCustomResource=true \
              --version ${{ vars.CHAOS_MESH_CHART_VERSION || '2.6.3' }} \
              --wait --timeout 5m
          fi
          kubectl get pods -n chaos-mesh --no-headers 2>/dev/null | head -5 || \
            echo "No Chaos Mesh pods found - experiments may fail"

      - name: Generate Chaos manifests from NFR
        run: |
          python3 /tmp/ct-common/scripts/nfr-to-chaos.py \
            --nfr nfr.yaml \
            --service ${{ env.SERVICE_NAME }} \
            --output-dir chaos-generated
          echo "Generated manifests:"
          ls -la chaos-generated/

      # ---------------------------------------------------------------
      # Helper: run one chaos experiment with k6 monitoring + recovery
      # ---------------------------------------------------------------
      - name: Write chaos runner script
        shell: bash
        run: |
          cat > /tmp/run-chaos-experiment.sh << 'RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail
          #
          # run-chaos-experiment <manifest> <experiment_name> <duration_seconds> <service>
          #
          # 1. Starts k6 traffic generator (GET only via chaos-traffic.js)
          # 2. Applies the chaos manifest
          # 3. Starts health canary (curl /health every 1s) to measure real outage
          # 4. Waits for chaos duration
          # 5. Stops k6, waits for canary, computes recovery_time_seconds
          # 6. Cleans up (--wait=false, no hang on stresschaos finalizers)
          # Writes: <workspace>/chaos-results/<exp_name>.json, /tmp/chaos-recovery-times.txt
          #
          MANIFEST="$1"
          EXP_NAME="$2"
          DURATION="$3"
          SERVICE="$4"

          mkdir -p /tmp/chaos-results

          # Start k6 traffic generator (GET only, no database writes)
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -v /tmp/chaos-results:/tmp/chaos-results \
            -w /workspace \
            -e BASE_URL=http://localhost:8080 \
            --env-file /tmp/k6-env.txt \
            --name "k6-${EXP_NAME}" \
            grafana/k6 run perf/chaos-traffic.js \
              --summary-export=/tmp/chaos-results/${EXP_NAME}.json \
              --tag test_type=chaos \
              --tag chaos_experiment=${EXP_NAME} &
          K6_PID=$!

          # Allow k6 to reach service before chaos
          sleep 3

          # Apply chaos
          echo "=== Applying ${EXP_NAME} ==="
          kubectl apply -f "${MANIFEST}"

          # Start health canary: polls /health every 1s, detects outage window
          echo "=== Monitoring recovery for ${EXP_NAME} ==="
          (
            OUTAGE_START=0
            OUTAGE_END=0
            CANARY_MAX=$(( DURATION + 300 ))
            for i in $(seq 1 ${CANARY_MAX}); do
              if curl -sf --max-time 5 http://localhost:8080/health >/dev/null 2>&1; then
                if [ "$OUTAGE_START" -ne 0 ] && [ "$OUTAGE_END" -eq 0 ]; then
                  OUTAGE_END=$(date +%s)
                  echo "=== Canary: recovered at t=$((i-1))s ==="
                fi
              else
                if [ "$OUTAGE_START" -eq 0 ]; then
                  OUTAGE_START=$(date +%s)
                  echo "=== Canary: outage detected at t=$((i-1))s ==="
                fi
              fi
              # Stop early if chaos duration elapsed AND we have already recovered
              if [ "$i" -gt "$DURATION" ] && [ "$OUTAGE_END" -ne 0 ]; then
                break
              fi
              sleep 1
            done
            echo "$OUTAGE_START $OUTAGE_END" > /tmp/canary-outage-${EXP_NAME}.txt
          ) &
          CANARY_PID=$!

          # Wait for chaos duration
          echo "=== Waiting ${DURATION}s for chaos ${EXP_NAME} ==="
          sleep "${DURATION}"

          # Stop k6
          echo "=== Stopping k6 for ${EXP_NAME} ==="
          kill "${K6_PID}" 2>/dev/null || true
          wait "${K6_PID}" 2>/dev/null || true

          # Wait for canary to finish and compute recovery
          wait "${CANARY_PID}" 2>/dev/null || true
          read -r OUTAGE_START OUTAGE_END < /tmp/canary-outage-${EXP_NAME}.txt 2>/dev/null || true
          OUTAGE_START=${OUTAGE_START:-0}
          OUTAGE_END=${OUTAGE_END:-0}
          if [ "$OUTAGE_START" = "0" ]; then RECOVERY_SEC=0; else
            if [ "$OUTAGE_END" = "0" ]; then RECOVERY_SEC=-1; else
              RECOVERY_SEC=$(( OUTAGE_END - OUTAGE_START ))
            fi
          fi
          echo "Recovery time: ${RECOVERY_SEC}s"

          # Cleanup chaos immediately so the next experiment starts clean
          echo "=== Cleaning up ${EXP_NAME} ==="
          kubectl delete -f "${MANIFEST}" --ignore-not-found --wait=false 2>/dev/null || true

          # Write recovery time
          RECOVERY_SEC=${RECOVERY_SEC:--1}
          echo "${EXP_NAME}: ${RECOVERY_SEC}s" >> /tmp/chaos-recovery-times.txt
          RUNNER

          chmod +x /tmp/run-chaos-experiment.sh

      - name: Port-forward to AKS (persistent)
        run: |
          (
            while true; do
              kubectl port-forward -n app svc/${{ env.SERVICE_NAME }} 8080:8080 || true
              sleep 1
            done
          ) &
          PF_PID=$!
          echo "$PF_PID" > /tmp/pf-pid.txt
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then
              echo "Tunnel ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Tunnel failed after 30s" >&2
          exit 1

      # =============================================================
      # Baseline k6 before any chaos
      # =============================================================
      - name: Baseline k6 before chaos
        env:
          BASE_URL: http://localhost:8080
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace \
            -v /tmp/chaos-results:/tmp/chaos-results \
            -w /workspace \
            -e BASE_URL \
            --env-file /tmp/k6-env.txt \
            grafana/k6 run perf/smoke.js \
              --summary-export=baseline-before-chaos.json \
              --tag test_type=baseline_before_chaos

      # =============================================================
      # Dynamic chaos experiments — iterate over generated manifests
      # =============================================================
      - name: Run all chaos experiments
        env:
          FILTER: ${{ inputs.chaos_experiments_filter }}
        run: |
          # Read manifest list and run each matching experiment
          jq -c '.experiments[]' chaos-generated/manifest-list.json | while read exp; do
            NAME=$(echo "$exp" | jq -r '.name')
            FILE=$(echo "$exp" | jq -r '.file')
            TYPE=$(echo "$exp" | jq -r '.type')

            # Apply filter if set (comma-separated list of experiment names)
            if [ -n "$FILTER" ]; then
              MATCH=0
              IFS=',' read -ra PARTS <<< "$FILTER"
              for f in "${PARTS[@]}"; do
                f="$(echo "$f" | xargs)"  # trim whitespace
                if [ "$NAME" = "$f" ]; then MATCH=1; break; fi
              done
              if [ "$MATCH" -eq 0 ]; then
                echo "=== Skipping $NAME (not in filter) ==="
                continue
              fi
            fi

            echo "=== Running chaos experiment: $NAME (type=$TYPE) ==="
            if timeout $(( CHAOS_DURATION + 420 )) /tmp/run-chaos-experiment.sh \
              "$FILE" \
              "$NAME" \
              "${{ env.CHAOS_DURATION }}" \
              "${{ env.SERVICE_NAME }}"; then
              :  # experiment completed within timeout
            else
              RC=$?
              if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then
                echo "=== TIMEOUT: experiment $NAME hung — recording failure ==="
                echo "${NAME}: -1s" >> /tmp/chaos-recovery-times.txt
              else
                echo "=== WARNING: experiment $NAME exited with code $RC ==="
              fi
            fi
          done

      # =============================================================
      # Consolidate results
      # =============================================================
      - name: Consolidate chaos results
        run: |
          # Build recovery JSON from collected times
          RECOVERY_JSON="{"
          FIRST=true
          if [ -f /tmp/chaos-recovery-times.txt ]; then
            while IFS=':' read -r exp_name recovery_sec; do
              exp_name=$(echo "$exp_name" | xargs)
              recovery_sec=$(echo "$recovery_sec" | xargs | sed 's/s//')
              if [ "$FIRST" = true ]; then FIRST=false; else RECOVERY_JSON+=","; fi
              RECOVERY_JSON+="\"${exp_name}\": {\"recovery_time_seconds\": ${recovery_sec}}"
            done < /tmp/chaos-recovery-times.txt
          fi
          RECOVERY_JSON+="}"
          echo "$RECOVERY_JSON" > /tmp/chaos-recovery.json
          echo "=== Recovery times ==="
          cat /tmp/chaos-recovery.json

          # Merge per-experiment k6 summary exports into one NDJSON file
          if ls /tmp/chaos-results/*.json 2>/dev/null; then
            for f in /tmp/chaos-results/*.json; do
              [ -s "$f" ] && jq -c '.metrics | to_entries[] | {type: "Metric", metric: .key, data: {values: .value.values}}' "$f"
            done > chaos-results.json 2>/dev/null || true
          fi

          # Network-delay observation: compare chaos p95 vs baseline p95.
          # If NetworkChaos added < 10ms to p95, warn (port-forward bypasses overlay).
          if [ -f baseline-before-chaos.json ] && ls /tmp/chaos-results/network-delay.json 2>/dev/null; then
            BL_P95=$(jq -r '.metrics.http_req_duration.values | ."p(95)" // 0' baseline-before-chaos.json 2>/dev/null || echo 0)
            ND_P95=$(jq -r '.metrics.http_req_duration.values | ."p(95)" // 0' /tmp/chaos-results/network-delay.json 2>/dev/null || echo 0)
            DIFF=$(( ND_P95 - BL_P95 ))
            if [ "$DIFF" -lt 10 ] 2>/dev/null; then
              echo "=== WARNING: network-delay experiment had no observable effect (p95 diff=${DIFF}ms)."
              echo "=== Port-forward traffic bypasses the Service overlay; delay injection may be invisible."
              echo "=== Consider running k6 as an in-cluster Job for accurate latency injection."
            else
              echo "=== OK: network-delay added ${DIFF}ms to p95."
            fi
          fi

      - name: Upload chaos k6 results
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: |
            /tmp/chaos-results/*.json
            /tmp/chaos-recovery.json
            baseline-before-chaos.json

      # =============================================================
      # Cleanup
      # =============================================================
      - name: Cleanup
        if: always()
        run: |
          # Kill any leftover k6 containers
          docker rm -f $(docker ps -aq --filter name=k6-) 2>/dev/null || true
          # Kill port-forward
          if [ -f /tmp/pf-pid.txt ]; then
            kill $(cat /tmp/pf-pid.txt) 2>/dev/null || true
          fi
          pkill -f "port-forward.*svc/${{ env.SERVICE_NAME }}" 2>/dev/null || true
          # Remove any leftover chaos resources
          kubectl delete podchaos --all -n ${{ env.CHAOS_NAMESPACE }} --ignore-not-found 2>/dev/null || true
          kubectl delete networkchaos --all -n ${{ env.CHAOS_NAMESPACE }} --ignore-not-found 2>/dev/null || true
          kubectl delete stresschaos --all -n ${{ env.CHAOS_NAMESPACE }} --ignore-not-found 2>/dev/null || true
